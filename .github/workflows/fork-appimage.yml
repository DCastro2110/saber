name: Fork AppImage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main

concurrency:
  group: fork-appimage
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'saber-notes/saber'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase fork patches onto upstream
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/saber-notes/saber.git
          git fetch upstream main
          git rebase upstream/main

          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          upstreamSha=$(git rev-parse --short upstream/main)
          forkSha=$(git rev-parse --short "$GITHUB_SHA")
          tag="v${buildName}-${upstreamSha}-${forkSha}"
          echo "buildName=$buildName" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.rebase.outputs.skip == 'false'
        uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup Flutter
        if: steps.rebase.outputs.skip == 'false'
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter

      - name: Build Linux
        if: steps.rebase.outputs.skip == 'false'
        run: |
          flutter config --no-cli-animations
          ./patches/pre/remove_permission_handler.sh
          ./patches/pre/remove_proprietary_dependencies.sh
          flutter build linux --target-platform linux-x64

      - name: Build AppImage
        if: steps.rebase.outputs.skip == 'false'
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get install -y libfuse2t64

          appDir=linux/AppImage/AppDir
          rm -rf "$appDir"
          mkdir -p "$appDir/usr/bin"
          cp -R build/linux/x64/release/bundle/* "$appDir/usr/bin/"
          chmod +x "$appDir/usr/bin/saber"
          install -Dm644 flatpak/com.adilhanney.saber.metainfo.xml -t "$appDir/usr/share/metainfo/"
          install -Dm644 assets/icon/icon_linux.svg "$appDir/usr/share/icons/hicolor/scalable/apps/com.adilhanney.saber.svg"
          install -Dm644 flatpak/com.adilhanney.saber.desktop -t "$appDir/usr/share/applications/"

          export LDAI_OUTPUT="Saber-${{ steps.rebase.outputs.buildName }}-x86_64.AppImage"
          export LD_LIBRARY_PATH="$(pwd)/$appDir/usr/bin/lib:$LD_LIBRARY_PATH"
          export LDAI_UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|Saber-*-x86_64.AppImage.zsync"

          cd linux/AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Publish release
        if: steps.rebase.outputs.skip == 'false'
        run: |
          gh release create "${{ steps.rebase.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Saber ${{ steps.rebase.outputs.tag }}" \
            --notes "Upstream saber-notes/saber@$(git rev-parse --short upstream/main) with the fork's patches." \
            --latest \
            linux/AppImage/Saber-*.AppImage*
